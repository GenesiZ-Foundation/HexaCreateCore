plugins {
  id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
  distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
  srcDir('src/generated/resources')

    exclude("src/generated/**/.cache")
}

repositories {
  maven {
    name = 'GeckoLib'
      url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
      content {
        includeGroup("software.bernie.geckolib")
      }
  }
  maven {
    name = "BlameJared Maven"
      url = "https://maven.blamejared.com"
  }
  exclusiveContent {
    forRepository {
      flatDir {
        dirs "libs"
      }
    }
    filter {
      includeGroup "libs"
    }
  }
  maven {
    name = "Wispforest Maven"
      url = "https://maven.wispforest.io/releases"
  }
  maven {
    name = "ParchmentMC Maven"
      url = "https://maven.parchmentmc.org"
  }
  maven { url "https://maven.shedaniel.me/" }
  maven { url 'https://maven.su5ed.dev/releases' }

  // temp change
  maven { url = "https://maven.gnomecraft.net/releases" }

  maven {
    name = 'Ladysnake Mods'
      url = 'https://maven.ladysnake.org/releases'
  }

  maven {
    name = 'Kotlin for Forge'
      url = 'https://thedarkcolour.github.io/KotlinForForge/'
  }

  maven {
    url = "https://pool.net.eu.org/"
  }

  maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
  maven { url = "https://mvn.devos.one/snapshots" } // Registrate
  maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort

  maven { url = "https://maven.theillusivec4.top/" } // Curios API

  maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }

  exclusiveContent { // Sable
    forRepository {
      maven {
        url = "https://maven.ryanhcode.dev/releases"
          name = "RyanHCode Maven"
      }
    }
    filter {
      includeGroup("dev.ryanhcode.sable")
        includeGroup("dev.ryanhcode.sable-companion")
    }
  }

  mavenCentral()
}

base {
  archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

  neoForge {
    version = project.neo_version

      parchment {
        mappingsVersion = project.parchment_mappings_version
          minecraftVersion = project.parchment_minecraft_version
      }

    runs {
      client {
        client()
          systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
      }

      server {
        server()
          programArgument '--nogui'
          systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
      }

      gameTestServer {
        type = "gameTestServer"
          systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
      }

      data {
        data()
          programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
      }

      configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'

          logLevel = org.slf4j.event.Level.DEBUG
      }
    }

    mods {
      "${mod_id}" {
        sourceSet(sourceSets.main)
      }
    }
  }

configurations {
  runtimeClasspath.extendsFrom localRuntime
}

dependencies {
  // Example optional mod dependency with JEI
  // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
  // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
  // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
  // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
  // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

  // Example mod dependency using a mod jar from ./libs with a flat dir repository
  // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
  // The group id is ignored when searching -- in this case, it is "blank"
  // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

  // Example mod dependency using a file as dependency
  // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

  // Example project dependency using a sister or child project:
  // implementation project(":myproject")

  // For more info:
  // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
  // http://www.gradle.org/docs/current/userguide/dependency_management.html
  implementation("vazkii.patchouli:Patchouli:$minecraft_version-$patchouli_version-NEOFORGE")
    implementation("libs:Jade-1.21.1-NeoForge-15.10.6")
    implementation("libs:AstralSorcery-2.0.3.59")
    implementation("libs:curios-neoforge-9.5.1+1.21.1")
    implementation("libs:create-1.21.1-6.0.10")
    implementation("libs:observerlib-1.10.3")
    implementation("libs:geckolib-neoforge-1.21.1-4.9.3")
    implementation("libs:block_factorys_bosses-2.1.2-neo-1.21.1")
    implementation("libs:legendary_monsters-2.2.4 MC 1.21.1")
    implementation("libs:witherreincarnated-1.21.1-1.0.5")
    implementation("libs:enderdragonplus-1.21.1-neoforge-0.3")
    implementation("libs:bosslike-ender-dragon-1.5.0-1.21.1-neoforge")
    implementation("libs:hexcasting-neoforge-$minecraft_version:$hexcasting_version")
    implementation("libs:paucal:$paucal_version+$minecraft_version-neoforge")
    implementation("libs:moreiotas-${moreiotas_version}-${minecraft_version}-devel-pre-${moreiotas_pre_num}")
    implementation("com.samsthenerd.inline:inline-neoforge:$minecraft_version-$inline_version")
    implementation("dev.architectury:architectury-neoforge:$architectury_api_version")
    implementation("io.wispforest:accessories-neoforge:$accessories_version+$minecraft_version")
    implementation("thedarkcolour:kotlinforforge-neoforge:$kff_version")
    runtimeOnly("com.illusivesoulworks.caelus:caelus-neoforge:$caelus_version+$minecraft_version")
    compileOnly("com.illusivesoulworks.caelus:caelus-neoforge:$caelus_version+$minecraft_version:api")
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-$minecraft_version:$sable_companion_version"
    api ("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
      exclude group: "foundry.veil"
    }
  runtimeOnly ("foundry.veil:veil-neoforge-$minecraft_version:$veil_version") {
    exclude group: "maven.modrinth"
  }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
  var replaceProperties = [
    minecraft_version      : minecraft_version,
                           minecraft_version_range: minecraft_version_range,
                           neo_version            : neo_version,
                           loader_version_range   : loader_version_range,
                           mod_id                 : mod_id,
                           mod_name               : mod_name,
                           mod_license            : mod_license,
                           mod_version            : mod_version,
  ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
  publications {
    register('mavenJava', MavenPublication) {
      from components.java
    }
  }
  repositories {
    maven {
      url "file://${project.projectDir}/repo"
    }
  }
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8' 
}

idea {
  module {
    downloadSources = true
      downloadJavadoc = true
  }
}
